name: Build Chromium v151 Stealth (Windows x64)

# Produces a WINDOWS chrome.exe + runtime files (parity with the CloakBrowser
# v146 cache layout) so the CyberPunch tool can consume it via
# CLOAKBROWSER_BINARY_PATH -- no Pro license needed.
#
# HEAVY BUILD WARNING: a from-scratch Windows Chromium build needs ~100+ GB of
# disk and many hours. GitHub-hosted windows-2022 runners give ~85 GB free, so
# this may fail on disk. If it does, use a self-hosted runner or a larger runner
# (see QA_REPORT.md "Runner size"). Shallow sync (--no-history) is used to help.

on:
  workflow_dispatch:
    inputs:
      chromium_tag:
        description: 'Exact Chromium git tag'
        required: true
        default: '151.0.7922.108'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 2160
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'          # use the runner's VS 2022, not Google's internal pkg
      GYP_MSVS_VERSION: '2022'
      DEPOT_TOOLS_UPDATE: '1'
    steps:
      - name: Checkout repo (patches live here)
        uses: actions/checkout@v4
        with:
          path: stealth-repo

      - name: Free up disk and pick checkout drive
        shell: pwsh
        run: |
          # Drop big preinstalled SDKs we do not need, reclaim space for the checkout.
          foreach ($p in @("$env:AGENT_TOOLSDIRECTORY","C:\Android","C:\Program Files\dotnet\sdk\NuGetFallbackFolder",
                           "C:\Program Files\Microsoft SDKs\Azure","C:\Program Files (x86)\Microsoft SDKs\Azure",
                           "C:\Program Files\PostgreSQL","C:\Program Files\MongoDB","C:\hostedtoolcache")) {
            if (Test-Path $p) { try { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue } catch {} }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} -Auto
          # Pick the fixed drive (C: or D:) with the MOST free space for the ~100GB tree.
          # Run #2 proved the tree does NOT reliably land on C:\c -- so choose dynamically
          # and hand the real path to every later step via $GITHUB_ENV.
          $cand = foreach ($d in 'C','D') {
            $psd = Get-PSDrive -Name $d -ErrorAction SilentlyContinue
            if ($psd) { [pscustomobject]@{ Letter=$d; Free=$psd.Free } }
          }
          $best = $cand | Sort-Object Free -Descending | Select-Object -First 1
          $root = "$($best.Letter):\cr"
          Write-Host "Chosen checkout drive: $($best.Letter): ($([math]::Round($best.Free/1GB,1)) GB free) -> $root"
          "CHROMIUM_ROOT=$root"      | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "CHROMIUM_SRC=$root\src"   | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: Setup depot_tools
        shell: cmd
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo C:\depot_tools>>%GITHUB_PATH%

      - name: Fetch Chromium source at tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # git writes progress to stderr; don't let Actions treat it as terminating
          $env:PATH = "C:\depot_tools;$env:PATH"

          # --- Harden git for a HUGE, flaky transfer -----------------------------------
          # Run #3 died mid-fetch with:
          #   curl 56 schannel: server closed abruptly (missing close_notify)
          #   fetch-pack: unexpected disconnect ... fatal: early EOF
          # That is the well-known Windows *schannel* abrupt-close bug on large fetches.
          # Switch git's TLS backend to openssl (sidesteps it), force HTTP/1.1 (no HTTP/2
          # stream resets), disable low-speed aborts, and grow the buffer.
          git config --global http.sslBackend openssl
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1572864000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 0

          Write-Host "Checkout root: $env:CHROMIUM_ROOT"
          New-Item -ItemType Directory -Force $env:CHROMIUM_ROOT | Out-Null
          Set-Location $env:CHROMIUM_ROOT

          # Let `fetch` create the checkout: it writes a CORRECT .gclient (proper Python
          # with quoted keys) and starts the first sync. Run #4 proved that hand-writing
          # the spec via `gclient config --spec $spec` breaks -- PowerShell strips the inner
          # double-quotes, so .gclient became `name: src` (unquoted) -> Python syntax error,
          # and all retries then failed on the broken config.
          # We call fetch AT MOST ONCE (guarded by .gclient existence), so the
          # ".gclient already exists" re-run error can't happen; if fetch's own sync dies on
          # the network, .gclient still exists and the retry loop below resumes it.
          if (-not (Test-Path "$env:CHROMIUM_ROOT\.gclient")) {
            Write-Host "== initial fetch (writes .gclient + first sync) =="
            & fetch --nohooks --no-history chromium
            Write-Host "   fetch returned rc=$LASTEXITCODE (ignored here; retry loop verifies)"
          }
          if (-not (Test-Path "$env:CHROMIUM_ROOT\.gclient")) {
            Write-Host "::error::.gclient was not created by fetch"; exit 1
          }

          # Phase 1: finish pulling the tree. Retry the flaky multi-GB fetch (sync resumes).
          $ok = $false
          for ($i = 1; $i -le 8; $i++) {
            Write-Host "== gclient sync (tree) attempt $i/8 =="
            & gclient sync --nohooks --no-history -R
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "   attempt $i failed (rc=$LASTEXITCODE) -- likely a network drop; retry in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { Write-Host "::error::gclient sync (tree) failed after 8 retries (network)"; exit 1 }

          # Pin to the exact release tag.
          Set-Location $env:CHROMIUM_SRC
          & git fetch --tags --depth 1 origin "tags/${{ github.event.inputs.chromium_tag }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tag fetch failed"; exit 1 }
          & git checkout "tags/${{ github.event.inputs.chromium_tag }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tag checkout failed"; exit 1 }

          # Phase 2: sync DEPS to the tag + run hooks (no --nohooks). Retry too.
          $ok2 = $false
          for ($i = 1; $i -le 6; $i++) {
            Write-Host "== gclient sync (DEPS+hooks) attempt $i/6 =="
            & gclient sync -D --force --no-history
            if ($LASTEXITCODE -eq 0) { $ok2 = $true; break }
            Write-Host "   attempt $i failed (rc=$LASTEXITCODE); retry in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok2) { Write-Host "::error::gclient sync (DEPS) failed after 6 retries"; exit 1 }

          # Fail LOUD now (not 3h later) if the tree did not materialise.
          if (-not (Test-Path "$env:CHROMIUM_SRC\BUILD.gn")) {
            Write-Host "::error::Chromium src missing at $env:CHROMIUM_SRC after fetch"
            Get-ChildItem $env:CHROMIUM_ROOT | Format-Table Name
            exit 1
          }
          Write-Host "Source ready at $env:CHROMIUM_SRC"
          $drive = $env:CHROMIUM_ROOT.Substring(0,2)
          fsutil volume diskfree $drive

      - name: Apply stealth patches (auto-fix offsets)
        shell: pwsh
        run: |
          # Use the REAL checkout path captured by the "pick checkout drive" step
          # ($env:CHROMIUM_SRC). Do NOT hardcode C:\c\src -- run #2 proved the tree
          # does not reliably land there. git ships with depot_tools.
          $env:PATH = "C:\depot_tools;$env:PATH"
          if (-not (Test-Path $env:CHROMIUM_SRC)) { Write-Host "::error::CHROMIUM_SRC not found: $env:CHROMIUM_SRC"; exit 1 }
          Set-Location $env:CHROMIUM_SRC
          $patches = Get-ChildItem "$env:GITHUB_WORKSPACE\stealth-repo\patches\*.patch" | Sort-Object Name
          if (-not $patches) { Write-Host "::error::No .patch files found"; exit 1 }
          foreach ($p in $patches) {
            Write-Host "== Applying $($p.Name) =="
            # Try progressively more tolerant strategies so small line-offset
            # drift against this exact tag does not fail the (3h) build.
            $ok = $false
            # git writes progress/errors to stderr; do NOT merge with 2>&1 or the
            # runner's $ErrorActionPreference='Stop' turns it into a terminating error.
            $ErrorActionPreference = 'Continue'
            foreach ($opts in @(
                ,@('--whitespace=fix')
                ,@('--recount','--whitespace=fix')
                ,@('--3way','--recount','--whitespace=fix')
                ,@('-C1','--recount','--whitespace=fix'))) {
              & git apply @opts "$($p.FullName)"
              if ($LASTEXITCODE -eq 0) { $ok = $true; Write-Host "   applied via: git apply $($opts -join ' ')"; break }
            }
            if (-not $ok) {
              Write-Host "::error::Patch failed to apply: $($p.Name) (rebase against tag ${{ github.event.inputs.chromium_tag }} - see QA_REPORT.md)"
              exit 1
            }
          }
          Write-Host "All patches applied."

      - name: Generate GN configuration
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          cd /d "%CHROMIUM_SRC%" || exit /b 1
          if not exist out\StealthRelease mkdir out\StealthRelease
          copy /Y "%GITHUB_WORKSPACE%\stealth-repo\args.gn" out\StealthRelease\args.gn || exit /b 1
          call gn gen out\StealthRelease || exit /b 1

      - name: Compile chrome
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          cd /d "%CHROMIUM_SRC%" || exit /b 1
          call autoninja -C out\StealthRelease chrome || exit /b 1

      - name: Package runtime (parity with CloakBrowser cache)
        shell: pwsh
        run: |
          $o = "$env:CHROMIUM_SRC\out\StealthRelease"
          $stage = "C:\stage\chromium-v151-stealth"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $files = @(
            'chrome.exe','chrome.dll','chrome_elf.dll','chrome_proxy.exe',
            'chrome_100_percent.pak','chrome_200_percent.pak','resources.pak',
            'icudtl.dat','snapshot_blob.bin','v8_context_snapshot.bin',
            'dxcompiler.dll','dxil.dll','vk_swiftshader.dll','vulkan-1.dll',
            'libEGL.dll','libGLESv2.dll','d3dcompiler_47.dll','mojo_core.dll'
          )
          foreach ($f in $files) { if (Test-Path "$o\$f") { Copy-Item "$o\$f" $stage -Force } }
          if (Test-Path "$o\locales") { Copy-Item "$o\locales" $stage -Recurse -Force }
          # version marker the wrapper looks for
          "${{ github.event.inputs.chromium_tag }}" | Out-File "$stage\VERSION.txt" -Encoding ascii
          Compress-Archive -Path "$stage\*" -DestinationPath "C:\chromium-v151-stealth-win-x64.zip" -Force
          Get-Item "C:\chromium-v151-stealth-win-x64.zip" | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-v151-stealth-win-x64
          path: C:\chromium-v151-stealth-win-x64.zip
          if-no-files-found: error
